global
    maxconn 500

defaults
    mode tcp
    timeout connect 10s
    timeout client 40s
    timeout server 40s
    retries 3
    option redispatch

listen tor_multiplexer
    bind 0.0.0.0:10800
    mode tcp
    balance leastconn
    server tor1 127.0.0.1:9051 check inter 3000 fastinter 1000 fall 2 rise 2
    server tor2 127.0.0.1:9052 check inter 3000 fastinter 1000 fall 2 rise 2
    server tor3 127.0.0.1:9053 check inter 3000 fastinter 1000 fall 2 rise 2
    server tor4 127.0.0.1:9054 check inter 3000 fastinter 1000 fall 2 rise 2
    server tor5 127.0.0.1:9055 check inter 3000 fastinter 1000 fall 2 rise 2
    server tor6 127.0.0.1:9056 check inter 3000 fastinter 1000 fall 2 rise 2
    server tor7 127.0.0.1:9057 check inter 3000 fastinter 1000 fall 2 rise 2
    server tor8 127.0.0.1:9058 check inter 3000 fastinter 1000 fall 2 rise 2

